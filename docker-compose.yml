version: '3.8'

services:
  agency-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cineflow-agency
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=production_super_secret_jwt_key_change_in_env_file_98765
      - FRONTEND_URL=http://localhost:5000
    volumes:
      # Persist SQLite database and uploads across container restarts
      - agency-db:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agency-db:
