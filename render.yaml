services:
  - type: web
    name: cineflow-agency
    env: node
    plan: free
    buildCommand: "npm run build && cd backend && npx prisma generate && npx prisma db push"
    startCommand: "npm start"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "file:./dev.db"
